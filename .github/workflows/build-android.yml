name: Build Kaveri Reels Android APK & AAB

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install Capacitor dependencies
        run: npm install

      - name: Add Android platform and sync web assets
        run: |
          npx cap add android
          npx cap sync android

      - name: Build Debug APK and Release AAB
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug bundleRelease

      - name: Upload APK and AAB Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: KaveriReels-Android-Builds
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            android/app/build/outputs/bundle/release/app-release.aab
