<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Kaveri Reels — The Kaveri Chronicle</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    html, body {
      width: 100%; height: 100%; background: #070709; color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      overflow: hidden; user-select: none;
    }

    /* Top Bar */
    .top-bar {
      position: fixed; top: 0; left: 0; right: 0; z-index: 30;
      padding: calc(env(safe-area-inset-top, 14px) + 10px) 16px 14px;
      background: linear-gradient(to bottom, rgba(0,0,0,0.85), transparent);
      display: flex; justify-content: space-between; align-items: center;
    }
    .brand { display: flex; align-items: center; gap: 8px; }
    .brand-badge {
      background: linear-gradient(135deg, #f59e0b, #d97706);
      color: #000; font-weight: 800; font-size: 11px; padding: 3px 7px; border-radius: 6px;
      letter-spacing: 0.5px;
    }
    .series-title { font-size: 15px; font-weight: 700; letter-spacing: 0.2px; }
    .ep-pill {
      background: rgba(255,255,255,0.16); backdrop-filter: blur(8px);
      border: 1px solid rgba(255,255,255,0.22); color: #fff;
      padding: 6px 12px; border-radius: 20px; font-size: 12px; font-weight: 600; cursor: pointer;
    }

    /* Vertical Snap Feed */
    .feed {
      width: 100%; height: 100%; overflow-y: scroll;
      scroll-snap-type: y mandatory; scroll-behavior: smooth;
    }
    .feed::-webkit-scrollbar { display: none; }

    .slide {
      position: relative; width: 100%; height: 100%;
      scroll-snap-align: start; scroll-snap-stop: always;
      background: #0d0d12; display: flex; align-items: center; justify-content: center;
    }
    video {
      width: 100%; height: 100%; object-fit: cover; background: #000;
    }

    /* Center Play / Status Overlay */
    .center-play {
      position: absolute; z-index: 18;
      width: 68px; height: 68px; border-radius: 50%;
      background: rgba(0,0,0,0.62); border: 2px solid rgba(255,255,255,0.8);
      color: #fff; font-size: 26px; display: flex; align-items: center; justify-content: center;
      cursor: pointer; backdrop-filter: blur(4px);
    }
    .center-play.hidden { display: none; }

    .status-pill {
      position: absolute; top: 74px; left: 50%; transform: translateX(-50%); z-index: 25;
      background: rgba(245, 158, 11, 0.92); color: #000;
      padding: 6px 14px; border-radius: 20px; font-size: 12px; font-weight: 700;
      cursor: pointer; box-shadow: 0 4px 14px rgba(0,0,0,0.45);
    }
    .status-pill.hidden { display: none; }

    /* Lock Overlay */
    .lock-screen {
      position: absolute; inset: 0; z-index: 20;
      background: radial-gradient(circle at center, rgba(24,20,14,0.9), rgba(7,7,9,0.98));
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      padding: 28px; text-align: center;
    }
    .lock-icon {
      width: 64px; height: 64px; border-radius: 50%;
      background: rgba(245, 158, 11, 0.16); border: 1px solid rgba(245, 158, 11, 0.45);
      display: flex; align-items: center; justify-content: center; font-size: 28px; margin-bottom: 16px;
    }
    .lock-screen h3 { font-size: 20px; margin-bottom: 8px; color: #fbbf24; }
    .lock-screen p { font-size: 14px; color: #cbd5e1; line-height: 1.5; max-width: 300px; margin-bottom: 22px; }
    .unlock-btn {
      background: linear-gradient(135deg, #f59e0b, #ea580c);
      color: #fff; border: none; padding: 14px 24px; border-radius: 12px;
      font-size: 15px; font-weight: 700; cursor: pointer;
      box-shadow: 0 8px 24px rgba(234, 88, 12, 0.4);
    }

    /* Bottom Metadata & Right Controls */
    .overlay-bottom {
      position: absolute; left: 0; right: 68px; bottom: 0; z-index: 15;
      padding: 20px 16px calc(env(safe-area-inset-bottom, 16px) + 18px);
      background: linear-gradient(to top, rgba(0,0,0,0.9), transparent);
      pointer-events: none;
    }
    .ep-tag {
      display: inline-block; font-size: 11px; font-weight: 700; text-transform: uppercase;
      color: #fbbf24; letter-spacing: 0.8px; margin-bottom: 6px;
    }
    .ep-name { font-size: 17px; font-weight: 700; margin-bottom: 6px; }
    .ep-desc { font-size: 13px; color: #d1d5db; line-height: 1.4; }

    .right-rail {
      position: absolute; right: 12px; bottom: calc(env(safe-area-inset-bottom, 16px) + 28px);
      z-index: 25; display: flex; flex-direction: column; gap: 18px; align-items: center;
    }
    .rail-btn {
      width: 44px; height: 44px; border-radius: 50%;
      background: rgba(255,255,255,0.16); backdrop-filter: blur(8px);
      border: 1px solid rgba(255,255,255,0.2); color: #fff;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      font-size: 18px; cursor: pointer;
    }
    .rail-label { font-size: 10px; color: #e5e7eb; margin-top: 3px; font-weight: 600; text-align: center; }

    /* Progress Bar */
    .progress-track {
      position: absolute; bottom: 0; left: 0; right: 0; height: 3px;
      background: rgba(255,255,255,0.2); z-index: 30;
    }
    .progress-fill { height: 100%; width: 0%; background: #f59e0b; transition: width 0.15s linear; }

    /* Episode Drawer */
    .drawer-backdrop {
      position: fixed; inset: 0; background: rgba(0,0,0,0.65); z-index: 40;
      display: none; align-items: flex-end;
    }
    .drawer-backdrop.open { display: flex; }
    .drawer {
      width: 100%; max-height: 68vh; background: #13131a;
      border-top-left-radius: 20px; border-top-right-radius: 20px;
      padding: 18px 16px calc(env(safe-area-inset-bottom, 16px) + 18px);
      overflow-y: auto; border-top: 1px solid rgba(255,255,255,0.12);
    }
    .drawer-header {
      display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px;
    }
    .drawer-header h4 { font-size: 16px; font-weight: 700; }
    .close-drawer {
      background: rgba(255,255,255,0.12); border: none; color: #fff;
      width: 30px; height: 30px; border-radius: 50%; font-size: 16px; cursor: pointer;
    }
    .ep-grid {
      display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px;
    }
    .ep-card {
      background: #1c1c26; border: 1px solid rgba(255,255,255,0.08);
      border-radius: 12px; padding: 12px 10px; text-align: center; cursor: pointer;
    }
    .ep-card.active { border-color: #f59e0b; background: rgba(245,158,11,0.14); }
    .ep-card-num { font-size: 14px; font-weight: 700; margin-bottom: 4px; }
    .ep-card-status { font-size: 11px; color: #9ca3af; }
    .ep-card.locked .ep-card-status { color: #fbbf24; }
  </style>
</head>
<body>

  <div class="top-bar">
    <div class="brand">
      <span class="brand-badge">SERIES 1</span>
      <span class="series-title">Echoes of Hampi</span>
    </div>
    <button class="ep-pill" id="openDrawerBtn">Episodes (6)</button>
  </div>

  <main class="feed" id="feed"></main>

  <div class="drawer-backdrop" id="drawerBackdrop">
    <div class="drawer">
      <div class="drawer-header">
        <h4>The Kaveri Chronicle: Echoes of Hampi</h4>
        <button class="close-drawer" id="closeDrawerBtn">✕</button>
      </div>
      <div class="ep-grid" id="epGrid"></div>
    </div>
  </div>

  <script>
    // Paste your Cloudflare R2 public JSON URL here once uploaded (e.g., https://pub-xxx.r2.dev/episodes.json)
    const REMOTE_MANIFEST_URL = "";

    // Active HTTPS MP4 sample streams (replace with your Cloudflare R2 MP4 URLs when ready)
    let episodes = [
      {
        id: 1,
        title: "Ep 1: The Chola Astrolabe",
        synopsis: "Archaeologist Arjun Rao uncovers a bronze dial in Mysuru that hums whenever Kaveri waters rise.",
        videoUrl: "https://interactive-examples.mdn.mozilla.net/media/cc0-videos/flower.mp4",
        free: true
      },
      {
        id: 2,
        title: "Ep 2: Gates of 1365 Vijayanagara",
        synopsis: "Pulled across seven centuries, Arjun collides with Princess Devika inside the royal Virupaksha courtyard.",
        videoUrl: "https://media.w3.org/2010/05/sintel/trailer.mp4",
        free: true
      },
      {
        id: 3,
        title: "Ep 3: Vikramaditya's Spy",
        synopsis: "Commander Vikramaditya Sen suspects Arjun is a northern spy—until the astrolabe predicts an ambush.",
        videoUrl: "https://media.w3.org/2010/05/bunny/trailer.mp4",
        free: true
      },
      {
        id: 4,
        title: "Ep 4: The Tungabhadra Cipher",
        synopsis: "Devika reveals the hidden chamber beneath Vittala Temple before the eclipse closes the rift.",
        videoUrl: "https://media.w3.org/2010/05/video/movie_300.mp4",
        free: false
      },
      {
        id: 5,
        title: "Ep 5: Betrayal at Midnight",
        synopsis: "A forged royal seal turns the palace guard against Devika and Arjun.",
        videoUrl: "https://interactive-examples.mdn.mozilla.net/media/cc0-videos/flower.mp4",
        free: false
      },
      {
        id: 6,
        title: "Ep 6: Return to Mysuru",
        synopsis: "Arjun steps back into modern Mysuru—only to realize someone from 1365 followed him home.",
        videoUrl: "https://media.w3.org/2010/05/sintel/trailer.mp4",
        free: false
      }
    ];

    const unlockedIds = new Set(JSON.parse(localStorage.getItem("kaveri_unlocked") || "[]"));
    let activeIndex = 0;
    // Start muted so Android WebView allows instant autoplay on launch; user can tap to unmute
    let isMuted = true;

    const feedEl = document.getElementById("feed");
    const epGridEl = document.getElementById("epGrid");
    const drawerBackdrop = document.getElementById("drawerBackdrop");

    function isEpisodeUnlocked(ep) {
      return ep.free || unlockedIds.has(ep.id);
    }

    function saveUnlocks() {
      localStorage.setItem("kaveri_unlocked", JSON.stringify([...unlockedIds]));
    }

    function triggerRewardedAdUnlock(epId) {
      unlockedIds.add(epId);
      saveUnlocks();
      renderAll();
      scrollToEpisode(episodes.findIndex(e => e.id === epId));
    }

    function updateMuteUI() {
      document.querySelectorAll("video").forEach(v => v.muted = isMuted);
      document.querySelectorAll(".mute-btn").forEach(b => b.textContent = isMuted ? "🔇" : "🔊");
      document.querySelectorAll(".mute-label").forEach(l => l.textContent = isMuted ? "Muted" : "Sound");
      document.querySelectorAll(".status-pill").forEach(p => {
        if (isMuted) p.classList.remove("hidden");
        else p.classList.add("hidden");
      });
    }

    function renderAll() {
      feedEl.innerHTML = "";
      epGridEl.innerHTML = "";

      episodes.forEach((ep, idx) => {
        const unlocked = isEpisodeUnlocked(ep);
        const slide = document.createElement("section");
        slide.className = "slide";
        slide.dataset.index = idx;

        if (unlocked) {
          slide.innerHTML = `
            <video playsinline webkit-playsinline autoplay loop preload="auto" muted src="${ep.videoUrl}"></video>
            <button class="status-pill ${isMuted ? "" : "hidden"}">🔇 Tap for Sound</button>
            <button class="center-play">▶</button>
            <div class="overlay-bottom">
              <span class="ep-tag">The Kaveri Chronicle • Ep ${ep.id}</span>
              <div class="ep-name">${ep.title}</div>
              <div class="ep-desc">${ep.synopsis}</div>
            </div>
            <div class="right-rail">
              <div>
                <button class="rail-btn mute-btn">${isMuted ? "🔇" : "🔊"}</button>
                <div class="rail-label mute-label">${isMuted ? "Muted" : "Sound"}</div>
              </div>
              <div>
                <button class="rail-btn drawer-trigger">☰</button>
                <div class="rail-label">Episodes</div>
              </div>
            </div>
            <div class="progress-track"><div class="progress-fill"></div></div>
          `;

          const video = slide.querySelector("video");
          const playBtn = slide.querySelector(".center-play");
          const soundPill = slide.querySelector(".status-pill");
          const fill = slide.querySelector(".progress-fill");

          video.muted = isMuted;

          video.addEventListener("playing", () => playBtn.classList.add("hidden"));
          video.addEventListener("pause", () => playBtn.classList.remove("hidden"));
          video.addEventListener("error", () => {
            playBtn.textContent = "↻";
            playBtn.classList.remove("hidden");
          });

          const togglePlay = () => {
            if (video.paused) video.play().catch(() => {});
            else video.pause();
          };

          video.addEventListener("click", togglePlay);
          playBtn.addEventListener("click", (e) => {
            e.stopPropagation();
            video.load();
            video.play().catch(() => {});
          });

          soundPill.addEventListener("click", (e) => {
            e.stopPropagation();
            isMuted = false;
            updateMuteUI();
            if (video.paused) video.play().catch(() => {});
          });

          video.addEventListener("timeupdate", () => {
            if (video.duration) {
              fill.style.width = `${(video.currentTime / video.duration) * 100}%`;
            }
          });

          slide.querySelector(".mute-btn").addEventListener("click", (e) => {
            e.stopPropagation();
            isMuted = !isMuted;
            updateMuteUI();
          });

          slide.querySelector(".drawer-trigger").addEventListener("click", (e) => {
            e.stopPropagation();
            drawerBackdrop.classList.add("open");
          });
        } else {
          slide.innerHTML = `
            <div class="lock-screen">
              <div class="lock-icon">🔒</div>
              <h3>${ep.title}</h3>
              <p>${ep.synopsis}</p>
              <button class="unlock-btn">▶ Watch Short Ad to Unlock Ep ${ep.id}</button>
            </div>
          `;
          slide.querySelector(".unlock-btn").addEventListener("click", () => triggerRewardedAdUnlock(ep.id));
        }

        feedEl.appendChild(slide);

        const card = document.createElement("div");
        card.className = `ep-card ${idx === activeIndex ? "active" : ""} ${!unlocked ? "locked" : ""}`;
        card.innerHTML = `
          <div class="ep-card-num">Ep ${ep.id}</div>
          <div class="ep-card-status">${unlocked ? "▶ Ready" : "🔒 Watch Ad"}</div>
        `;
        card.addEventListener("click", () => {
          drawerBackdrop.classList.remove("open");
          scrollToEpisode(idx);
        });
        epGridEl.appendChild(card);
      });

      observeSlides();
    }

    function scrollToEpisode(idx) {
      const target = feedEl.children[idx];
      if (target) target.scrollIntoView({ behavior: "smooth" });
    }

    function observeSlides() {
      const observer = new IntersectionObserver((entries) => {
        entries.forEach(entry => {
          const video = entry.target.querySelector("video");
          const idx = Number(entry.target.dataset.index);
          if (entry.isIntersecting) {
            activeIndex = idx;
            document.querySelectorAll(".ep-card").forEach((c, i) => c.classList.toggle("active", i === idx));
            if (video) {
              video.muted = isMuted;
              video.play().catch(() => {});
            }
          } else if (video) {
            video.pause();
            video.currentTime = 0;
          }
        });
      }, { threshold: 0.65 });

      document.querySelectorAll(".slide").forEach(s => observer.observe(s));
    }

    document.getElementById("openDrawerBtn").addEventListener("click", () => drawerBackdrop.classList.add("open"));
    document.getElementById("closeDrawerBtn").addEventListener("click", () => drawerBackdrop.classList.remove("open"));
    drawerBackdrop.addEventListener("click", (e) => {
      if (e.target === drawerBackdrop) drawerBackdrop.classList.remove("open");
    });

    async function init() {
      if (REMOTE_MANIFEST_URL) {
        try {
          const res = await fetch(REMOTE_MANIFEST_URL);
          const remoteEpisodes = await res.json();
          if (Array.isArray(remoteEpisodes) && remoteEpisodes.length) episodes = remoteEpisodes;
        } catch (err) {
          console.warn("Using bundled episodes:", err);
        }
      }
      renderAll();
    }

    init();
  </script>
</body>
</html>
